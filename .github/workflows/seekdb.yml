# SeekDB CI - 执行下沉版（Native）
# setup 准备 observer → 4 个并行 mysqltest job（各独立容器）→ collect 合并结果
name: SeekDB CI 

on:
  push:
    branches: [master, develop, dev_master_ci, ci-test]
  pull_request:
    branches: [master, develop]
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - 'README.md'
      - 'README_CN.md'
      - 'CONTRIBUTING.md'
      - '.gitignore'
  schedule:
    - cron: '30 9 * * *'
  workflow_dispatch:

env:
  MYSQLTEST_SLICES: "4"
  cache-name: cache-deps
  SEEKDB_TASK_DIR: ${{ github.workspace }}/seekdb_build/${{ github.run_id }}
  SEEKDB_RESULT_NFS_ROOT: /data/storage/jenkins_on_k8s/results/seekdb

jobs:
  seekdb-setup:
    name: setup
    runs-on: arc-runner-k8s-ci-org-test
    container:
      image: harbor.oceanbase-dev.com/obrde-test/ob-actions-runner-worker:0.0.2
    steps:
      - name: Configure git to use SSH
        shell: bash
        run: |
          git config --global url."git@github.com:".insteadOf "https://github.com/"
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Verify SSH key mount
        shell: bash
        run: |
          echo "=== user ==="
          id
          echo "=== ssh dir ==="
          ls -la /obshared/seekdb/ || true
          echo "=== ssh github banner ==="
          ssh -T git@github.com || true

      - name: Verify Bazel and gh-proxy
        shell: bash
        run: |
          echo "=== 0. 检查 Pod /etc/hosts (hostAliases) ==="
          grep -E 'releases\.bazel\.build|gh-proxy\.com' /etc/hosts || true

          echo "=== 1. 验证 Bazel 下载 (releases.bazel.build) ==="
          curl --noproxy '*' -fsSL \
            --connect-timeout 5 --max-time 30 \
            --resolve releases.bazel.build:443:172.16.0.220 \
            -w '\nHTTP %{http_code}\n' \
            'https://releases.bazel.build/9.3.0/release/bazel-9.3.0-linux-x86_64.sha256'

          echo "=== 2. 验证 Bazel 依赖下载 (gh-proxy.com) ==="
          curl --noproxy '*' -fsSL \
            --connect-timeout 5 --max-time 30 \
            --resolve gh-proxy.com:443:172.16.0.220 \
            -w '\nHTTP %{http_code}\n' \
            'https://gh-proxy.com/https://raw.githubusercontent.com/bazelbuild/bazel-central-registry/main/modules/rules_cc/0.2.25/MODULE.bazel'

          echo "=== 3. 验证通过 /etc/hosts 直接访问（无需 --resolve） ==="
          curl --noproxy '*' -fsSL \
            --connect-timeout 5 --max-time 30 \
            -w '\nHTTP %{http_code}\n' \
            'https://releases.bazel.build/9.3.0/release/bazel-9.3.0-linux-x86_64.sha256'

      - name: Cache deps
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-build-${{ env.cache-name }}-el9.x86_64-${{ hashFiles('deps/init/oceanbase.el9.x86_64.deps') }}
          path: deps/3rd

      - name: Prepare (jobargs, run_jobs)
        shell: bash
        run: |
          chmod +x .github/script/seekdb/prepare.sh
          export GITHUB_RUN_ID="${{ github.run_id }}"
          export GITHUB_WORKSPACE="${{ github.workspace }}"
          export MYSQLTEST_SLICES="${{ env.MYSQLTEST_SLICES }}"
          export SEEKDB_TASK_DIR="${{ env.SEEKDB_TASK_DIR }}"
          echo "run success"
          sleep 120
          curl --proto '=https' --tlsv1.2 -sSf https://rsproxy.cn/rustup-init.sh | sh
          time curl -o /dev/null -L --max-time 120 -w 'http=%{http_code} time=%{time_total}s size=%{size_download} speed=%{speed_download}\n' https://rsproxy.cn/dist/2026-07-16/cargo-1.97.1-x86_64-unknown-linux-gnu.tar.xz
          sleep 1200
          echo "!!!!!!!!1!"
          echo "!!!!!!!!!"
